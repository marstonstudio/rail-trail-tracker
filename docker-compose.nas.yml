# NAS deployment — pulls published image from Docker Hub
# Only this file + a ./data/ directory are needed on the NAS
services:
  rail-trails:
    image: marstonstudio/rail-trail-tracker:latest
    container_name: rail-trail-tracker
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - PORT=3000
      - DATA_FILE=/data/trails.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/trails"]
      interval: 30s
      timeout: 5s
      retries: 3
